<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game of Deals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a felt card table — opponents along the top rail, the pile and the order in play at the centre, your field and fanned hand at the bottom. */
:root{
 --felt:#0e3a32; --felt2:#13503f; --rail:#241811; --ink:#f4ecd6; --muted:#a9c2b7; --gold:#e8b74a; --gold2:#f6d27c;
 --danger:#e4574b; --ok:#5fc48d; --panel:#0a2b25; --line:rgba(244,236,214,.14); --chip:rgba(0,0,0,.28);
 --display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
 color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--felt2),var(--felt) 60%,#082a24);color:var(--ink);font-family:var(--body);font-size:15px;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--felt)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;max-width:1180px;margin:0 auto;box-sizing:border-box}
.view{min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--chip);border:1px solid var(--line);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a05;border-color:transparent;box-shadow:0 4px 0 #9c7424}
.btn.red{background:var(--danger);border-color:transparent;color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
/* home */
.hero{display:grid;place-items:center;text-align:center;gap:18px;padding-block:28px 8px}
.logo{font-family:var(--display);font-size:clamp(48px,13vw,96px);line-height:.9;color:var(--gold2);text-shadow:0 4px 0 #6d4a12,0 10px 30px rgba(0,0,0,.45);transform:rotate(-3deg)}
.logo small{display:block;font-size:.34em;color:var(--ink);letter-spacing:6px;transform:rotate(2deg);text-shadow:none;margin-top:6px}
.fan{display:flex;justify-content:center;height:150px;margin-block:6px 4px}
.fan img{width:92px;border-radius:9px;box-shadow:0 8px 22px rgba(0,0,0,.5);margin-inline:-26px;transform-origin:50% 120%;transition:transform .3s}
.menu{display:grid;gap:10px;width:min(420px,100%);margin-inline:auto}
.menu .btn{padding:15px;font-size:17px}
.note{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.7;max-width:60ch}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.code{font-family:var(--display);font-size:42px;letter-spacing:8px;color:var(--gold2);direction:ltr}
.plist{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--chip);border-radius:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#14110a;flex:none;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
/* table */
#table{display:flex;flex-direction:column;height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--rail),#1b120c);border-bottom:2px solid #3b2a1d;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;align-items:center;gap:10px}
.turnb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turnb .who{color:var(--gold2)}
.moves{display:flex;gap:4px}
.moves i{width:11px;height:11px;border-radius:50%;background:var(--gold);display:block}
.moves i.u{background:transparent;border:2px solid #6b5a3a;box-sizing:border-box}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;position:relative}
.badge{position:absolute;top:-6px;left:-6px;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
.main{flex:1;display:grid;grid-template-columns:1fr;gap:0;min-height:0}
@media(min-width:960px){.main{grid-template-columns:1fr 330px}}
.board{min-width:0;display:flex;flex-direction:column;gap:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 150px}
.side{display:none;border-inline-start:1px solid var(--line);background:rgba(0,0,0,.18);min-height:0;flex-direction:column}
@media(min-width:960px){.side{display:flex;height:calc(100vh - 60px);position:sticky;top:60px}}
.opps{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.pod{flex:none;width:150px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:9px;text-align:start;display:grid;gap:6px;transition:border-color .3s,box-shadow .3s}
.pod.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,183,74,.35),0 0 24px rgba(232,183,74,.25)}
.pod.tgt{border-color:var(--danger);box-shadow:0 0 0 2px rgba(228,87,75,.4)}
.pod .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.pod .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{color:var(--ink)}
.swatches{display:flex;gap:3px;flex-wrap:wrap;min-height:14px}
.sw{width:12px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.4)}
.sw.full{outline:2px solid var(--gold2);outline-offset:1px}
.flags{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
.flag{background:rgba(0,0,0,.35);border-radius:6px;padding:1px 6px}
.center{display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:center;background:rgba(0,0,0,.18);border:1px dashed var(--line);border-radius:18px;padding:12px}
.pile{width:70px;aspect-ratio:2/3;border-radius:9px;position:relative;max-width:100%}
.back{background:url(img/back.png) center/cover no-repeat;border:0;box-shadow:3px 3px 0 #0b1530,6px 6px 0 #07101f}
.pile .n{position:absolute;bottom:-9px;inset-inline:0;margin:auto;width:max-content;background:var(--rail);border-radius:8px;padding:0 7px;font-size:12px;font-variant-numeric:tabular-nums}
.pile img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.pile.empty{border:2px dashed var(--line)}
.pending{min-width:0;display:grid;gap:6px;font-size:14px}
.pending .t{font-weight:700}
.pending .bar{height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pending .bar i{display:block;height:100%;background:var(--gold)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.sec-h b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
.field-area{display:flex;gap:8px;overflow-x:auto;padding-block:4px;min-height:78px}
.grp{flex:none;display:flex;flex-direction:column;gap:4px;align-items:center;background:rgba(0,0,0,.2);border-radius:12px;padding:6px;border:2px solid transparent}
.grp.full{border-color:var(--gold);background:rgba(232,183,74,.08)}
.grp .lbl{font-size:11px;color:var(--muted);white-space:nowrap}
.grp .cards{display:flex}
.grp .cards img{width:44px;border-radius:5px;margin-inline-start:-26px;box-shadow:-2px 2px 6px rgba(0,0,0,.4);cursor:pointer}
.grp .cards img:first-child{margin-inline-start:0}
.grp .blds{display:flex;gap:2px}
.grp .blds img{width:22px;border-radius:3px}
.bank{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.coin{background:linear-gradient(180deg,#f6d27c,#d39a2b);color:#2a1a05;border-radius:8px;padding:2px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.coin.visa{background:linear-gradient(180deg,#6b3fa0,#3b1d63);color:#fff}
.missions{display:flex;gap:8px;overflow-x:auto}
.mcard{flex:none;width:120px;font-size:11.5px;line-height:1.5;background:#f1efe9;color:#1d2340;border-radius:10px;padding:8px;border:2px solid #d9d5c9}
.mcard.done{border-color:var(--ok);background:#e7f6ec}
.mcard b{font-family:var(--display);font-weight:400;font-size:15px;color:#2b2f7c}
.handbar{position:fixed;inset:auto 0 0 0;z-index:6;background:linear-gradient(180deg,rgba(5,24,20,0),rgba(5,24,20,.92) 28%);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:18px}
@media(min-width:960px){.handbar{left:330px}}
.hand{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:thin;align-items:flex-end}
.hc{flex:none;width:78px;border:0;padding:0;background:none;border-radius:8px;transition:transform .18s;position:relative}
.hc img{width:100%;border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.5);display:block}
.hc:hover{transform:translateY(-8px)}
.hc.resp::after{content:"رد";position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:10px;border-radius:6px;padding:0 5px}
.hc.new{animation:deal .5s cubic-bezier(.2,.8,.3,1.2)}
@keyframes deal{from{transform:translateY(-140px) rotate(-12deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.actbar{display:flex;gap:8px;align-items:center;justify-content:space-between}
.actbar .info{font-size:13px;color:var(--muted)}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(560px,100%);max-height:86vh;overflow:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;animation:up .25s cubic-bezier(.2,.8,.3,1)}
@media(min-width:700px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet h3{font-size:22px;margin-bottom:6px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.opt img{width:44px;border-radius:5px;flex:none}
.opt .sub{font-size:12px;color:var(--muted)}
.opt.sel{border-color:var(--gold);background:rgba(232,183,74,.14)}
.opt[disabled]{opacity:.4}
.cardview{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.cardview img{width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media(max-width:420px){.cardview{grid-template-columns:110px 1fr}}
.toasts{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:0;z-index:30;display:grid;justify-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{background:#12100c;border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:10px;padding:8px 14px;font-size:14px;max-width:520px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:up .25s}
.toast.err{border-inline-start-color:var(--danger)}
.toast.good{border-inline-start-color:var(--ok)}
.flash{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.flash img{width:min(210px,52vw);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:flash 1.5s ease forwards}
@keyframes flash{0%{transform:translateY(60vh) rotate(8deg) scale(.6);opacity:0}25%{transform:none;opacity:1}75%{transform:none;opacity:1}100%{transform:scale(.4) translateY(-30vh);opacity:0}}
.logl{flex:1;overflow:auto;padding:10px 14px;display:grid;gap:6px;align-content:start;font-size:13px;line-height:1.55}
.logl div{border-bottom:1px solid var(--line);padding-bottom:5px}
.logl .good{color:#a8e9c2}.logl .bad{color:#f3a59d}.logl .play{color:var(--gold2)}
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.msgs{flex:1;overflow:auto;padding:10px 14px;display:grid;gap:6px;align-content:start;font-size:13.5px}
.msg b{color:var(--gold2);font-weight:700}
.chatform{display:flex;gap:6px;padding:10px}
.chatform input{flex:1}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-radius:8px;padding:7px;color:var(--muted)}
.tabs button.on{background:var(--chip);color:var(--ink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.gc{display:grid;gap:4px;font-size:12px;text-align:center;background:none;border:0;padding:0}
.gc img{width:100%;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.gc .cnt{background:var(--rail);border-radius:6px;padding:0 6px;justify-self:center;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--gold);color:#2a1a05;border-color:transparent}
.rules{line-height:1.9;max-width:70ch}
.rules h3{color:var(--gold2);font-size:22px;margin-top:18px}
.rules li{margin-bottom:4px}
table.adm{border-collapse:collapse;width:100%;font-size:13px}
table.adm td,table.adm th{border-bottom:1px solid var(--line);padding:6px;text-align:start;vertical-align:middle}
table.adm input{width:100%;box-sizing:border-box;padding:5px 7px}
.tblwrap{overflow-x:auto}
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.trophy{font-family:var(--display);font-size:54px;color:var(--gold2);text-shadow:0 4px 0 #6d4a12}
.score-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;width:100%;align-items:center;padding:8px 12px;background:var(--chip);border-radius:10px;font-variant-numeric:tabular-nums}
.mobile-only{display:inline-flex}
@media(min-width:960px){.mobile-only{display:none}}
.empty-st{padding:30px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const ENGINE=(function(){
/*ENGINE*/
const COLORS={
 lb:{n:'أزرق فاتح',hex:'#8fd0e8',size:3,rent:[1,2,3]},
 db:{n:'أزرق غامق',hex:'#3640c8',size:2,rent:[1,2]},
 pu:{n:'بنفسجي',hex:'#a03cb4',size:3,rent:[2,3,4]},
 or:{n:'برتقالي',hex:'#f08a24',size:3,rent:[2,4,6]},
 re:{n:'أحمر',hex:'#b0303a',size:3,rent:[3,5,7]},
 ye:{n:'أصفر',hex:'#d2d622',size:3,rent:[3,6,8]},
 gr:{n:'أخضر',hex:'#33a650',size:3,rent:[4,7,10]},
 bk:{n:'أسود',hex:'#2a2a2a',size:2,rent:[5,12]},
 br:{n:'بني',hex:'#7e4e2e',size:3,rent:[3,6,9]},
 gy:{n:'رمادي',hex:'#a3a3a3',size:2,rent:[3,7]},
 st:{n:'محطات',hex:'#e2483c',size:4,rent:[1,2,3,4]},
 rs:{n:'مطاعم',hex:'#d6a23e',size:2,rent:[2,3]},
};
const NO_BUILD=['st','rs'];
const CARDS={};
function def(id,o){CARDS[id]=Object.assign({id,cnt:1},o);}
// ---- lands
[['lb',1,[['lb_tabuk','شارع تبوك'],['lb_aqaria','شارع العقارية'],['lb_orouba','شارع العروبة'],['lb_qurayyan','شارع القريان'],['lb_kharj','شارع الخرج']]],
 ['or',2,[['or_malaz','شارع الملز'],['or_south','الدائري الجنوبي'],['or_wazir','شارع الوزير'],['or_sitteen','شارع الستين'],['or_dabab','شارع الضباب']]],
 ['ye',3,[['ye_abha','طريق أبها'],['ye_dammam','طريق الدمام'],['ye_jalawi','طريق سعود بن جلوي'],['ye_east','الدائري الشرقي'],['ye_tahlia','شارع التحلية']]],
 ['gr',4,[['gr_hail','طريق حائل'],['gr_west','الدائري الغربي'],['gr_khalid','شارع خالد بن الوليد'],['gr_anas','شارع أنس بن مالك'],['gr_jarir','شارع جرير']]],
 ['bk',5,[['bk_north','الدائري الشمالي'],['bk_madina','شارع المدينة'],['bk_qassim','طريق القصيم']]],
 ['db',1,[['db_makka','شارع مكة'],['db_hamza','شارع حمزة'],['db_abraj','شارع الأبراج']]],
 ['pu',2,[['pu_khalid','طريق الملك خالد'],['pu_arafa','شارع عرفة'],['pu_hijaz','طريق الحجاز'],['pu_takhassusi','شارع التخصصي'],['pu_haraj','حراج بن قاسم']]],
 ['re',3,[['re_qowat','شارع القوات الخاصة'],['re_taif','شارع الطائف'],['re_jeddah','سوق جدة'],['re_fahd','طريق الملك فهد'],['re_riyadh','سوق الرياض']]],
 ['br',4,[['br_abubakr','طريق أبو بكر'],['br_imam','شارع الإمام سعود'],['br_salman','شارع سلمان بن محمد'],['br_othman','طريق عثمان بن عفان'],['br_omar','طريق عمر بن الخطاب']]],
 ['gy',2,[['gy_hafsa','شارع حفصة بنت عمر'],['gy_mishal','شارع مشعل بن عبدالعزيز'],['gy_faisal','طريق فيصل بن بندر']]],
].forEach(([c,v,arr])=>arr.forEach(([id,n])=>def(id,{t:'land',c,v,n,g:'أراضٍ'})));
for(let k=1;k<=7;k++)def('st_'+k,{t:'land',c:'st',v:1,n:'محطة',g:'أراضٍ'});
for(let k=1;k<=3;k++)def('rs_'+k,{t:'land',c:'rs',v:2,n:'مطعم',g:'أراضٍ'});
def('du_blue',{t:'dual',cs:['db','lb'],v:2,n:'شارع السويلم / طريق درباب',g:'أراضٍ بوجهين'});
def('du_stres',{t:'dual',cs:['st','rs'],v:3,n:'محطة / مطعم',g:'أراضٍ بوجهين'});
def('du_greenblack',{t:'dual',cs:['bk','gr'],v:7,n:'شارع الثلاثين / طريق الملك فيصل',g:'أراضٍ بوجهين'});
def('du_purpleorange',{t:'dual',cs:['or','pu'],v:3,n:'شارع الوشم / شارع الجامعة',g:'أراضٍ بوجهين'});
def('du_redyellow',{t:'dual',cs:['ye','re'],v:4,n:'شارع العليا / طريق خريص',g:'أراضٍ بوجهين'});
def('du_graybrown',{t:'dual',cs:['br','gy'],v:5,n:'طريق المطار / طريق الملك سلمان',g:'أراضٍ بوجهين'});

const T=i=>i.split('.')[0];
const C=i=>CARDS[T(i)]||{n:'؟',t:'hidden',v:0,g:''};
const now=()=>Date.now();
function shuffle(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function R(S){S.seed=((S.seed||7)*1103515245+12345)>>>0;return S.seed/4294967296;}
function nm(S,u){const p=S.players.find(x=>x.id===u);return p?p.name:'؟';}
function cn(i){return C(i).n;}
function log(S,m,kind){S.log.push({t:now(),m,k:kind||''});if(S.log.length>70)S.log.splice(0,S.log.length-70);}
function cardVal(i){const c=C(i);return c.v||0;}

// ---- table helpers
function colorsOf(p){const m={};for(const l of p.lands){(m[l.c]=m[l.c]||[]).push(l.i);}return m;}
function setInfo(p){const m=colorsOf(p),o={};for(const c in m){const size=COLORS[c].size,n=m[c].length,sets=Math.floor(n/size);o[c]={n,size,sets,inSet:m[c].slice(0,sets*size),loose:m[c].slice(sets*size)};}return o;}
function looseLands(p){const o=setInfo(p),r=[];for(const c in o)r.push(...o[c].loose);return r;}
function inSetLands(p){const o=setInfo(p),r=[];for(const c in o)r.push(...o[c].inSet);return r;}
function completeColors(p){const o=setInfo(p);return Object.keys(o).filter(c=>o[c].sets>0);}
function fenced(p,c){return (p.bld[c]||[]).some(i=>C(i).b==='fence');}
function missionsDone(p){return p.miss.filter(m=>m.done).length;}
function setsCount(p){const o=setInfo(p);let s=0;for(const c in o)s+=o[c].sets;return s;}
function score(p){return setsCount(p)+missionsDone(p);}
function bankMoney(p){return p.bank.reduce((s,i)=>s+cardVal(i),0);}
function hasVisa(p){return p.bank.some(i=>T(i)==='visa');}
function rentOf(p,c){const o=setInfo(p)[c];if(!o)return 0;const k=Math.min(o.n,o.size);let r=COLORS[c].rent[k-1];if(o.sets>0)for(const b of (p.bld[c]||[]))r+=C(b).bonus||0;return r;}
function landOwner(S,i){for(const u in S.P)if(S.P[u].lands.some(l=>l.i===i))return u;return null;}
function removeLand(p,i){const k=p.lands.findIndex(l=>l.i===i);if(k<0)return null;return p.lands.splice(k,1)[0];}
function fixBuildings(S,u){const p=S.P[u];const full=completeColors(p);for(const c of Object.keys(p.bld)){if(!p.bld[c].length){delete p.bld[c];continue;}if(full.includes(c))continue;const list=p.bld[c];delete p.bld[c];for(const b of list){const bt=C(b).b;const tgt=full.find(x=>!(p.bld[x]||[]).some(y=>C(y).b===bt)&&!(NO_BUILD.includes(x)&&bt!=='fence')&&(bt!=='hotel'||(p.bld[x]||[]).some(y=>C(y).b==='house')));if(tgt){(p.bld[tgt]=p.bld[tgt]||[]).push(b);log(S,`نُقل ${cn(b)} الخاص بـ ${nm(S,u)} إلى مجموعة ${COLORS[tgt].n}`);}else{p.hand.push(b);log(S,`رجع ${cn(b)} إلى يد ${nm(S,u)}`);}}}}
function moveSet(S,fromU,toU,c){const a=S.P[fromU],b=S.P[toU];const o=setInfo(a)[c];const take=o.inSet.slice(0,o.size);for(const i of take){const l=removeLand(a,i);b.lands.push(l);}const bl=a.bld[c]||[];if(bl.length&&setInfo(a)[c]&&setInfo(a)[c].sets>0){/* still has another set of same color: keep buildings */}else{delete a.bld[c];(b.bld[c]=b.bld[c]||[]).push(...bl);}fixBuildings(S,fromU);fixBuildings(S,toU);}
function burnSet(S,u,c){const a=S.P[u];const o=setInfo(a)[c];const take=o.inSet.slice(0,o.size);for(const i of take){removeLand(a,i);S.discard.push(i);}if(!(setInfo(a)[c]&&setInfo(a)[c].sets>0)){for(const b of (a.bld[c]||[]))S.discard.push(b);delete a.bld[c];}fixBuildings(S,u);}
function draw(S,u,n){const p=S.P[u];let got=0;for(let k=0;k<n;k++){if(!S.deck.length){if(!S.discard.length)break;S.deck=shuffle(S.discard.splice(0),()=>R(S));log(S,'تم خلط البطاقات المحروقة وإعادتها إلى كومة السحب');}p.hand.push(S.deck.pop());got++;}return got;}
function drawMission(S,u){if(!S.mdeck.length)return false;S.P[u].miss.push({i:S.mdeck.pop(),done:false});return true;}
function others(S,u){return S.order.filter(x=>x!==u);}
function seatNeighbor(S,u,side){const o=S.order;const k=o.indexOf(u);return o[(k+(side==='right'?1:-1)+o.length)%o.length];}

// ---- missions
function checkMission(S,u,m,ev){const p=S.P[u];const full=completeColors(p),o=setInfo(p);const has=c=>full.includes(c);
 switch(m){case 'm_bk':return has('bk');case 'm_db':return has('db');case 'm_bkrs':return has('bk')&&has('rs');case 'm_grst':return has('gr')&&has('st');case 'm_yegr':return has('ye')&&has('gr');case 'm_brgy':return has('br')&&has('gy');case 'm_reye':return has('re')&&has('ye');case 'm_orpu':return has('or')&&has('pu');case 'm_rsst':return has('rs')&&has('st');case 'm_reor':return has('re')&&has('or');case 'm_stlb':return has('st')&&has('lb');
 case 'm_2rs':return (o.rs&&o.rs.sets>=2);case 'm_16':return p.lands.length>=16;case 'm_bank60':return bankMoney(p)>=60;
 case 'm_bld':return full.some(c=>{const t=(p.bld[c]||[]).map(i=>C(i).b);return t.includes('house')&&t.includes('hotel')&&t.includes('castle');});
 case 'm_jf':return full.some(c=>fenced(p,c)&&o[c].inSet.some(i=>T(i)==='joker'));
 default:return !!(ev&&ev[m]);}}
function checkMissions(S,u,ev){const p=S.P[u];for(const ms of p.miss){if(ms.done)continue;if(checkMission(S,u,C(ms.i).m,ev)){ms.done=true;log(S,`🎯 ${nm(S,u)} أنجز مهمة: ${C(ms.i).d}`,'good');}}}
function checkWin(S){if(S.status!=='playing')return;for(const u of S.order)checkMissions(S,u);const start=S.order.indexOf(S.turn.p);for(let k=0;k<S.order.length;k++){const u=S.order[(start+k)%S.order.length];if(score(S.P[u])>=S.cfg.winSets){S.status='ended';S.winner=u;S.endedAt=now();S.pending=null;log(S,`🏆 فاز ${nm(S,u)} بعد جمع ${score(S.P[u])} مجموعات`,'good');return;}}}

// ---- game lifecycle
function newGame(code,host,name,cfg){return{code,v:0,status:'lobby',host,created:now(),players:[{id:host,name}],cfg:Object.assign({},DEFAULT_RULES,cfg&&cfg.rules||{}),counts:(cfg&&cfg.counts)||{},maxP:6,log:[],seed:(Math.random()*4e9)>>>0};}
function startGame(S){const ids=[];for(const id in CARDS){const c=CARDS[id];if(c.t==='mission')continue;const cnt=S.counts[id]!=null?S.counts[id]:c.cnt;for(let k=0;k<cnt;k++)ids.push(id+'.'+k);}
 const ms=Object.keys(CARDS).filter(id=>CARDS[id].t==='mission').flatMap(id=>{const cnt=S.counts[id]!=null?S.counts[id]:1;return Array.from({length:cnt},(_,k)=>id+'.'+k);});
 S.deck=shuffle(ids,()=>R(S));S.mdeck=shuffle(ms,()=>R(S));S.discard=[];S.order=shuffle(S.players.map(p=>p.id),()=>R(S));S.P={};
 for(const u of S.order){S.P[u]={hand:[],bank:[],lands:[],bld:{},miss:[],st:{nap:0,jail:0,jailBy:null,ebla:0,estq:0,barrier:0,bordga:null,tactic:0,open:0}};draw(S,u,5);drawMission(S,u);}
 S.status='playing';S.startedAt=now();S.dir=1;S.tc=0;S.fx={slow:0,fast:0,emp:0};S.deferred=[];S.hack=null;S.reveal={};S.lastOrder=null;S.pending=null;S.winner=null;S.idx=0;S.log=[];
 log(S,`بدأت المباراة. الترتيب: ${S.order.map(u=>nm(S,u)).join(' ← ')}`);beginTurn(S,S.order[0]);}
function beginTurn(S,u){S.tc++;const p=S.P[u];S.turn={p:u,phase:'draw',moves:S.cfg.moves,used:0,unl:false,again:false,ctrl:(S.hack&&S.hack.of===u)?S.hack.by:u};
 if(p.st.nap>0){p.st.nap--;log(S,`😴 ${nm(S,u)} في غفوة، تم تخطي دوره`);return endTurn(S,true);}
 if(p.st.jail>0){S.turn.phase='jail';return;}
 if(S.turn.ctrl!==u)log(S,`💀 ${nm(S,S.turn.ctrl)} يلعب بدلاً من ${nm(S,u)} هذا الدور`,'bad');}
function drawCountFor(S,u){const p=S.P[u];let n=p.hand.length===0?S.cfg.drawEmpty:S.cfg.draw;if(p.st.estq>0)n=1;if(S.fx.slow>S.tc||S.fx.emp>S.tc)n=1;return n;}
function doDraw(S,u){const p=S.P[u];const n=drawCountFor(S,u);if(p.st.estq>0)p.st.estq--;draw(S,u,n);log(S,`${nm(S,u)} سحب ${n} ${n===1?'بطاقة':'بطاقات'}`);
 if(p.hand.length>S.cfg.handLimit){const ex=p.hand.length-S.cfg.handLimit;for(let k=0;k<ex;k++){const j=Math.floor(R(S)*p.hand.length);S.discard.push(p.hand.splice(j,1)[0]);}log(S,`🔥 حُرقت ${ex} بطاقة عشوائية من يد ${nm(S,u)} لتجاوز الحد (${S.cfg.handLimit})`);}
 let mv=S.cfg.moves;if(p.st.ebla>0){mv=1;p.st.ebla--;}if(p.st.tactic>0){mv=1;p.st.tactic--;}if(S.fx.fast>S.tc||S.fx.emp>S.tc)mv=1;S.turn.moves=mv;S.turn.phase='play';openDeferred(S);}
function openDeferred(S){if(S.pending||S.status!=='playing')return;const u=S.turn.p;const k=S.deferred.findIndex(d=>d.queue[0]===u);if(k<0){if(S.turn.phase==='play'&&S.P[u].st.nap>0&&S.turn.napNow){S.P[u].st.nap--;log(S,`😴 ${nm(S,u)} أخذ الغفوة بعد التأجيل`);endTurn(S,true);}return;}
 const d=S.deferred.splice(k,1)[0];d.noLoading=true;d.dl=now()+S.cfg.timeout*1000;S.pending=d;log(S,`⏳ وصل الأمر المؤجَّل (${d.label}) إلى ${nm(S,u)}`);openTarget(S);}
function endTurn(S,skip){const u=S.turn.p;if(S.hack&&S.hack.of===u&&!skip)S.hack=null;if(!skip&&S.turn.again){S.turn.again=false;log(S,`🔁 ${nm(S,u)} يلعب مرة أخرى`);return beginTurn(S,u);}
 const o=S.order;let k=o.indexOf(u);k=(k+S.dir+o.length)%o.length;beginTurn(S,o[k]);}
function movesLeft(S){return S.turn.unl?99:S.turn.moves-S.turn.used;}

// ---- pending / responses
function label(a,cardIid){return cardIid?cn(cardIid):a;}
function needSel(a){return({stealland:'loose',confiscate:'loose',atni:'loose',theeb:'loose',boom:'loose',auction:'loose',darb:'anyland',getjoker:'joker',stealset:'set',sader:'set',swapset:'set',nuke:'setany'})[a]||null;}
function selOptions(S,a,from,t){const p=S.P[t];const k=needSel(a);if(!k)return null;
 if(k==='loose')return looseLands(p);
 if(k==='anyland'){const fc=completeColors(p).filter(c=>fenced(p,c));const o=setInfo(p);return p.lands.map(l=>l.i).filter(i=>{const l=p.lands.find(x=>x.i===i);return !(fc.includes(l.c)&&o[l.c].inSet.includes(i));});}
 if(k==='joker'){const o=setInfo(p);return p.lands.filter(l=>T(l.i)==='joker'&&!(fenced(p,l.c)&&o[l.c].inSet.includes(l.i))).map(l=>l.i);}
 if(k==='set')return completeColors(p).filter(c=>!fenced(p,c));
 if(k==='setany')return completeColors(p);}
function selValid(S,pd,t){const k=needSel(pd.a);if(!k)return true;const s=pd.sel&&pd.sel[t];const opts=selOptions(S,pd.a,pd.from,t);if(pd.a==='swapset'&&!completeColors(S.P[pd.from]).filter(c=>!fenced(S.P[pd.from],c)).includes(pd.mine))return false;if(pd.a==='atni'&&!looseLands(S.P[pd.from]).includes(pd.mine))return false;return s!=null&&opts.includes(s);}
function targetHasStuff(S,pd,t){const k=needSel(pd.a);if(k)return selOptions(S,pd.a,pd.from,t).length>0;if(pd.a==='swaphand')return S.P[t].hand.length>0;if(pd.a==='takecard')return S.P[t].hand.length>0;return true;}
function makePending(S,from,a,cards,extra){const pd=Object.assign({id:Math.random().toString(36).slice(2,9),a,from,benef:from,cards,black:cards.some(i=>C(i).black),queue:[],sel:{},stage:'respond',dl:now()+S.cfg.timeout*1000,label:cn(cards[0]),lots:[],burned:0,orig:from},extra||{});return pd;}
function openTarget(S){const pd=S.pending;while(pd&&pd.queue.length){const t=pd.queue[0];const p=S.P[t];pd.dl=now()+S.cfg.timeout*1000;
  if(!pd.black&&p.st.barrier>S.tc){log(S,`🛡️ ${nm(S,t)} محمي بالحاجز من ${pd.label}`);pd.queue.shift();continue;}
  if(!pd.black&&p.st.bordga&&p.st.bordga.from===pd.from&&p.st.bordga.tc===S.tc){log(S,`🛡️ ${nm(S,t)} محمي بـ BORDGA`);pd.queue.shift();continue;}
  if(needSel(pd.a)&&!selValid(S,pd,t)){if(targetHasStuff(S,pd,t)&&pd.a!=='theeb'&&pd.a!=='boom'&&pd.a!=='auction'&&pd.a!=='nuke'){pd.stage='reselect';return;}log(S,`${nm(S,t)} لا يملك ما يمكن أخذه بـ ${pd.label}`);pd.queue.shift();continue;}
  if(!targetHasStuff(S,pd,t)){log(S,`${nm(S,t)} لا يملك ما يتأثر بـ ${pd.label}`);pd.queue.shift();continue;}
  pd.stage='respond';pd.refuser=null;return;}
 if(pd)finishPending(S);}
function nextTarget(S){S.pending.queue.shift();openTarget(S);}
function finishPending(S){const pd=S.pending;S.pending=null;
 if(pd.a==='auction'&&pd.lots.length){S.pending=pd;pd.stage='bid';pd.lot=0;pd.bids={};pd.dl=now()+S.cfg.timeout*1000;log(S,`🔨 بدأ المزاد على ${pd.lots.length} أرض`);return;}
 if(pd.a==='theeb')S.P[pd.orig].st.nap+=1;
 const ev={};if(pd.a==='moab'&&pd.executed&&!pd.royal)ev.m_moab=1;if(pd.a==='nuke'&&pd.burned>0)ev.m_nuke=1;if(pd.royal&&pd.a==='nap'&&pd.executed)ev.m_rn=1;
 if(pd.stolePurple)ev.m_stealpu=1;checkMissions(S,pd.orig,ev);if(pd.stolePurple)checkMissions(S,pd.benef,{m_stealpu:1});checkWin(S);if(S.status==='playing'&&S.turn.phase==='play')openDeferred(S);}
function respOK(S,pd,who,a){const t=pd.queue[0];const isT=who===t;const pay=PAY_ACTIONS.includes(pd.a);
 if(pd.stage==='counter')return who===pd.from&&a==='takhsi';
 if(pd.stage!=='respond')return false;
 if(who===pd.from)return false;
 if(pd.black)return a==='takhsi'&&isT;
 if(!isT)return a==='taateel'||a==='gameover';
 if(pd.a==='auction')return ['takhsi','playaway','taateel','gameover'].includes(a);
 switch(a){case 'takhsi':case 'gameover':case 'playaway':case 'taateel':return true;
  case 'bordga':return true;
  case 'layikthar':return ['rent','rentwild','rentgold'].includes(pd.a);
  case 'nothing':return pay;case 'jibha':return pay;case 'payforme':return pay&&S.order.length>2;
  case 'haza':return pay&&!hasVisa(S.P[t])&&payAmount(S,pd,t)>bankMoney(S.P[t]);
  case 'right':case 'left':return S.order.length>2;case 'aks':return SINGLE.includes(pd.a);
  case 'asfeq':return S.order.length>2;case 'shofghairi':return true;case 'loading':return !pd.noLoading;
 }return false;}
function payAmount(S,pd,t){const m=pd.mult||1;switch(pd.a){case 'rent':case 'rentwild':return rentOf(S.P[pd.rentOwner||pd.benef],pd.color)*m;case 'rentgold':return rentOf(S.P[pd.rentOwner],pd.color)*m;
 case 'cash':return 2;case 'tax':return 3*m;case 'pay5':return 5;case 'spit':return 13*m;
 case 'eslahat':{const p=S.P[t];let s=0;s+=3*setsCount(p);for(const c in p.bld)for(const b of p.bld[c]){const bt=C(b).b;s+=bt==='fence'?2:1;}s+=2*p.lands.filter(l=>T(l.i)==='joker').length;return s;}
 case 'rusoom':return looseLands(S.P[t]).length;}return 0;}
function payable(p){return p.bank.filter(i=>T(i)!=='visa').concat(looseLands(p));}
function minCover(items,need){if(need<=0)return [];if(!items.length)return [];const lim=Math.min(items.length,14);let best=null,bs=1e9;for(let mask=1;mask<(1<<lim);mask++){let sm=0;for(let k=0;k<lim;k++)if(mask&(1<<k))sm+=cardVal(items[k]);if(sm>=need&&sm<bs){bs=sm;best=mask;}}if(best==null)return items.slice();const r=[];for(let k=0;k<lim;k++)if(best&(1<<k))r.push(items[k]);return r;}
function autoPick(S,u,amt){const p=S.P[u];const money=p.bank.filter(i=>T(i)!=='visa').sort((a,b)=>cardVal(a)-cardVal(b));const lands=looseLands(p).sort((a,b)=>cardVal(a)-cardVal(b));const mt=money.reduce((s,i)=>s+cardVal(i),0);if(mt>=amt)return minCover(money,amt);return money.concat(minCover(lands,amt-mt));}
function doPay(S,payer,payee,cards,opts){const a=S.P[payer],b=S.P[payee];opts=opts||{};
 if(opts.visa){const k=a.bank.findIndex(i=>T(i)==='visa');if(k<0)return 'لا تملك فيزا';b.bank.push(a.bank.splice(k,1)[0]);log(S,`💳 ${nm(S,payer)} سدّد بالفيزا وانتقلت إلى بنك ${nm(S,payee)}`);return null;}
 const pool=payable(a);for(const i of cards)if(!pool.includes(i))return 'بطاقة غير صالحة للدفع';const sum=cards.reduce((s,i)=>s+cardVal(i),0);const amt=opts.amount;
 if(sum<amt&&cards.length<pool.length)return `المبلغ المختار ${sum}M أقل من المطلوب ${amt}M`;
 for(const i of cards){const k=a.bank.indexOf(i);if(k>=0){b.bank.push(a.bank.splice(k,1)[0]);}else{const l=removeLand(a,i);b.lands.push(l);}}
 fixBuildings(S,payer);log(S,`💸 ${nm(S,payer)} دفع ${sum}M لـ ${nm(S,payee)}${cards.length?' ('+cards.map(cn).join('، ')+')':' (لا يملك شيئاً)'}`);
 if(opts.change&&sum>amt){const ci=a.hand.findIndex(i=>C(i).a==='change');if(ci>=0){S.discard.push(a.hand.splice(ci,1)[0]);let over=sum-amt;const back=[];const mon=b.bank.filter(i=>T(i)!=='visa').sort((x,y)=>cardVal(y)-cardVal(x));for(const i of mon){if(cardVal(i)<=over){over-=cardVal(i);back.push(i);}if(!over)break;}
   for(const i of back){b.bank.splice(b.bank.indexOf(i),1);a.bank.push(i);}if(over>0){for(const i of looseLands(b).sort((x,y)=>cardVal(y)-cardVal(x))){if(over<=0)break;const l=removeLand(b,i);a.lands.push(l);over-=cardVal(i);back.push(i);}}
   log(S,`💵 وين الباقي؟ ${nm(S,payee)} أرجع ${back.length?back.map(cn).join('، '):'لا شيء (لا يملك)'} إلى ${nm(S,payer)}`);fixBuildings(S,payee);}}
 return null;}
function applyAccept(S){const pd=S.pending,t=pd.queue[0],from=pd.benef,P=S.P;pd.executed=true;
 if(PAY_ACTIONS.includes(pd.a)){const amt=payAmount(S,pd,t);if(amt<=0||(!payable(P[t]).length&&!hasVisa(P[t]))){log(S,`${nm(S,t)} لا يملك ما يدفعه (${amt}M)`);return nextTarget(S);}pd.stage='pay';pd.pay={payer:t,payee:from,amount:amt};return;}
 const s=pd.sel[t];
 switch(pd.a){
 case 'dabatni':if(!looseLands(P[t]).length){log(S,`${nm(S,t)} لا يملك أرضاً خارج المجموعات`);return nextTarget(S);}pd.stage='choose';return;
 case 'stealland':case 'theeb':case 'darb':case 'getjoker':{const l=removeLand(P[t],s);P[from].lands.push(l);fixBuildings(S,t);log(S,`🦊 ${nm(S,from)} أخذ ${cn(s)} من ${nm(S,t)}`);break;}
 case 'confiscate':case 'boom':{removeLand(P[t],s);S.discard.push(s);fixBuildings(S,t);log(S,`🔥 احترقت ${cn(s)} من ساحة ${nm(S,t)}`);break;}
 case 'atni':{const a=removeLand(P[t],s),b=removeLand(P[from],pd.mine);P[from].lands.push(a);P[t].lands.push(b);log(S,`🔄 ${nm(S,from)} بدّل ${cn(pd.mine)} مقابل ${cn(s)} من ${nm(S,t)}`);break;}
 case 'stealset':{moveSet(S,t,from,s);if(s==='pu')pd.stolePurple=true;log(S,`🦊 ${nm(S,from)} زرف مجموعة ${COLORS[s].n} من ${nm(S,t)}`,'bad');break;}
 case 'swapset':{const mine=pd.mine;const tmp='__';moveSet(S,t,from,s);moveSet(S,from,t,mine);if(s==='pu')pd.stolePurple=true;log(S,`🔄 ${nm(S,from)} بدّل مجموعته ${COLORS[mine].n} بمجموعة ${COLORS[s].n} من ${nm(S,t)}`);break;}
 case 'sader':case 'nuke':{burnSet(S,t,s);pd.burned++;log(S,`☢️ احترقت مجموعة ${COLORS[s].n} الخاصة بـ ${nm(S,t)}`,'bad');break;}
 case 'moab':{const ls=looseLands(P[t]);for(const i of ls){removeLand(P[t],i);S.discard.push(i);}fixBuildings(S,t);log(S,`💣 M.O.A.B أحرق ${ls.length} أرض من ساحة ${nm(S,t)}`,'bad');break;}
 case 'bank':{const b=P[t].bank.splice(0);P[from].bank.push(...b);log(S,`🏦 ${nm(S,from)} زرف بنك ${nm(S,t)} (${b.length} بطاقة)`,'bad');break;}
 case 'jail':P[t].st.jail=S.cfg.jailTurns;P[t].st.jailBy=from;log(S,`🚔 ${nm(S,t)} دخل السجن`);break;
 case 'nap':P[t].st.nap+=1;if(S.turn.p===t&&S.turn.phase==='play'&&pd.noLoading)S.turn.napNow=true;log(S,`😴 ${nm(S,t)} أخذ غفوة`);break;
 case 'ebla':P[t].st.ebla=3;log(S,`${nm(S,t)} سيلعب حركة واحدة فقط لمدة 3 دورات`);break;
 case 'tactic':P[t].st.tactic=1;log(S,`${nm(S,t)} سيلعب حركة واحدة فقط في دوره القادم`);break;

   if(a==='give'){const g=op.give;if(!g||g===ci||!p.hand.includes(g))return 'اختر بطاقة لتعطيها';p.hand.splice(p.hand.indexOf(ci),1);S.discard.push(ci);p.hand.splice(p.hand.indexOf(g),1);P[tg].hand.push(g);T_.used++;log(S,`🎁 ${nm(S,me)} أعطى بطاقة لـ ${nm(S,tg)}`);return null;}
   if(a==='spit'||a==='tax'||a==='pay5'||a==='eslahat'||a==='rusoom'){} }
 else if(SELF.includes(a)){
   if(a==='burn')return 'استخدم زر الحرق مع بطاقة أخرى';
   if(a==='copy'){const lo=S.lastOrder;if(!lo||!S.discard.includes(lo)||C(lo).black)return 'لا يوجد أمر سابق يمكن أخذه';}
   for(const x of cards)p.hand.splice(p.hand.indexOf(x),1);S.discard.push(...cards);T_.used+=cards.length;
   const L=royal?pd.label:cn(ci);
   switch(a){case 'draw2':draw(S,me,2);log(S,`${nm(S,me)} لعب ${L} وسحب بطاقتين`);break;
    case 'again':T_.again=true;log(S,`${nm(S,me)} لعب ${L}: سيلعب دوراً إضافياً`);break;
    case 'moves2':T_.moves+=2;log(S,`${nm(S,me)} لعب ${L}: +2 حركات`);break;
    case 'newhand':{const h=p.hand.splice(0);S.discard.push(...h);draw(S,me,5);log(S,`${nm(S,me)} غيّر ورقه بخمس جديدة`);break;}
    case 'barrier':p.st.barrier=S.tc+S.order.length;log(S,`🛡️ ${nm(S,me)} وضع حاجزاً لدورة كاملة`);break;
    case 'slow':S.fx.slow=S.tc+S.order.length;log(S,`🐢 Slow Game: الجميع يسحب بطاقة واحدة لدورة`);break;
    case 'fast':S.fx.fast=S.tc+S.order.length;log(S,`⚡ Fast Game: الجميع حركة واحدة لدورة`);break;
    case 'emp':S.fx.emp=S.tc+S.order.length;log(S,`⚡ E.M.P: بطاقة واحدة وحركة واحدة للجميع لدورة كاملة`);break;
    case 'reverse':S.dir*=-1;log(S,`🔄 ${nm(S,me)} عكس الدور`);break;
    case 'yaweel':draw(S,me,5);T_.unl=true;p.st.nap+=1;log(S,`😈 ياويلكم! ${nm(S,me)} سحب 5 وحركاته مفتوحة (وعليه غفوة الدورة القادمة)`,'bad');break;
    case 'kharab':S.reveal[me]={miss:true,until:S.tc};log(S,`👹 ${nm(S,me)} يقرأ مهمات اللاعبين`);break;
    case 'box':drawMission(S,me)?log(S,`📦 ${nm(S,me)} سحب مهمة إضافية`):log(S,'لا توجد مهام متبقية');break;
    case 'luck':{const un=p.miss.filter(m=>!m.done);if(!un.length){drawMission(S,me);}else{for(const m of un){S.mdeck.unshift(m.i);p.miss.splice(p.miss.indexOf(m),1);}for(let k=0;k<un.length;k++)drawMission(S,me);}log(S,`🎲 ${nm(S,me)} بدّل مهامه غير المحققة`);break;}
    case 'copy':{const lo=S.lastOrder;S.discard.splice(S.discard.indexOf(lo),1);p.hand.push(lo);log(S,`📋 ${nm(S,me)} أخذ ${cn(lo)} من الساحة إلى يده`);break;}
    case 'burn':return 'استخدم زر الحرق';}
   checkMissions(S,me);checkWin(S);return null;}
 else return 'أمر غير مدعوم';
 for(const x of cards)p.hand.splice(p.hand.indexOf(x),1);S.discard.push(...cards);T_.used+=cards.length;S.lastOrder=ci;
 log(S,`🃏 ${nm(S,me)} لعب ${pd.label}${pd.queue.length===1?' على '+nm(S,pd.queue[0]):''}`,'play');
 pd.played=cards;S.pending=pd;openTarget(S);return null;}
function opLabel(a){const c=Object.values(CARDS).find(x=>x.a===a);return a==='rent'?'إيجار':c?c.n:a;}
return {COLORS,CARDS,T,C,act,setInfo,looseLands,inSetLands,completeColors,fenced,score,setsCount,missionsDone,bankMoney,hasVisa,rentOf,payable,autoPick,newGame,stageActor,respOK,payAmount,needSel,selOptions,movesLeft,RESP,SINGLE,GROUP,SELF,MULTABLE,PAY_ACTIONS,DEFAULT_RULES,drawCountFor,opLabel,NO_BUILD,landOwner};

/*END*/

})();
</script>
<script>
const E=ENGINE;const {CARDS,COLORS}=E;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=iid=>'img/'+E.T(iid)+'.jpg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS={get(k,d){try{const v=localStorage.getItem('god_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('god_'+k,JSON.stringify(v));}catch(e){}}};
const AVC=['#e8b74a','#8fd0e8','#f08a24','#5fc48d','#e2708a','#b99cf0'];
let db=null,user=null,room=null,uid=null,owner=false;
let view='home',code=null,G=null,unsubG=null,unsubChat=null,online=new Set(),CFG={cards:{},rules:{}};
let lastPendKey='',prevHand=new Set(),prevLogLen=0,busy=false,chatMsgs=[],chatSeen=0,sideTab='log',sound=LS.get('sound',true),lastTurnKey='';
const ORIG={};for(const id in CARDS)ORIG[id]={n:CARDS[id].n,d:CARDS[id].d,v:CARDS[id].v,cnt:CARDS[id].cnt};

// ---------- sound
let actx=null;function beep(f=520,d=.08,type='sine',vol=.06){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d+.02);}catch(e){}}
const sfx={turn(){beep(660,.12);setTimeout(()=>beep(880,.15),120);},card(){beep(320,.06,'triangle',.08);},bad(){beep(180,.2,'sawtooth',.04);},good(){beep(760,.1);setTimeout(()=>beep(990,.12),90);}};

function toast(m,k){const t=document.createElement('div');t.className='toast '+(k||'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),k==='err'?4200:3000);}
function flashCard(iid){const d=document.createElement('div');d.className='flash';d.innerHTML=`<img src="${img(iid)}" alt="">`;document.body.appendChild(d);setTimeout(()=>d.remove(),1600);}

// ---------- network (PeerJS: the host's browser runs the game and keeps the full state)
const PFX='gameofdeals5-';
let peer=null,isHost=false,hostConn=null,conns={},capDone=true,canW=true,noWrite=false,hostOK=false,retryT=null;
uid=LS.get('uid',null);if(!uid){uid='p'+Math.random().toString(36).slice(2,11);LS.set('uid',uid);}
owner=true;CFG=LS.get('cfg',{cards:{},rules:{}});
const NOPERM='';
function applyCfg(){for(const id in CARDS){const o=(CFG.cards||{})[id]||{};const b=ORIG[id];CARDS[id].n=o.n||b.n;CARDS[id].d=o.d!=null&&o.d!==''?o.d:b.d;CARDS[id].v=o.v!=null&&o.v!==''?+o.v:b.v;CARDS[id].cnt=o.cnt!=null&&o.cnt!==''?+o.cnt:b.cnt;}}
function ready(){if(!window.Peer){toast('تعذّر تحميل مكتبة الاتصال. تأكد من الإنترنت وحدّث الصفحة.','err');return false;}return true;}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let k=0;k<5;k++)s+=a[Math.floor(Math.random()*a.length)];return s;}
// what each player is allowed to see
function viewFor(S,u){if(!S.P)return S;const V=JSON.parse(JSON.stringify(S));const rv=S.reveal&&S.reveal[u]&&S.reveal[u].until===S.tc;
 for(const p in V.P){const seeHand=p===u||(S.turn&&S.turn.ctrl===u&&S.turn.p===p)||(rv&&S.reveal[u].hand===p)||(S.P[p].st.open>S.tc);if(!seeHand)V.P[p].hand=V.P[p].hand.map(()=>'x');
  if(p!==u&&!(rv&&S.reveal[u].miss))V.P[p].miss=V.P[p].miss.map(m=>m.done?m:{i:'x',done:false});}
 V.deck=V.deck.map(()=>'x');V.mdeck=V.mdeck.map(()=>'x');V.seed=0;
 if(V.deferred)V.deferred=V.deferred.map(d=>({label:d.label,queue:d.queue}));return V;}
function broadcast(){if(!isHost||!G)return;LS.set('host_'+code,G);for(const u in conns){const c=conns[u];if(c.open)c.send({t:'state',s:viewFor(G,u),online:[...online]});}}
function setOnline(){online=new Set([uid,...Object.keys(conns).filter(u=>conns[u].open)]);}
function hostApply(u,op){const S=JSON.parse(JSON.stringify(G));const err=E.act(S,u,op);if(err)return err;S.v=(S.v||0)+1;S.upd=Date.now();const old=G;G=S;broadcast();onGame(old,viewFor(G,uid),true);return null;}
function sysChat(m){chatMsgs.push({n:'🔔',x:m,t:Date.now()});chatMsgs=chatMsgs.slice(-80);relayChat();}
function relayChat(){if(isHost){LS.set('chat_'+code,chatMsgs);for(const u in conns)if(conns[u].open)conns[u].send({t:'chat',m:chatMsgs});}renderSide();}
function openPeer(id){return new Promise((res,rej)=>{const p=id?new Peer(id,{debug:0}):new Peer({debug:0});const to=setTimeout(()=>rej(new Error('timeout')),15000);p.on('open',()=>{clearTimeout(to);res(p);});p.on('error',e=>{clearTimeout(to);rej(e);});});}
async function startHost(c,S){isHost=true;code=c;G=S;conns={};
 try{peer=await openPeer(PFX+c);}catch(e){isHost=false;if(e&&e.type==='unavailable-id'){toast('رمز الغرفة مستخدم، جرّب مرة أخرى','err');}else toast('تعذّر الاتصال بخادم الربط. تأكد من الإنترنت.','err');return false;}
 peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
 peer.on('connection',conn=>{conn.on('data',msg=>onHostMsg(conn,msg));conn.on('close',()=>{const u=conn.u;if(u&&conns[u]===conn){delete conns[u];setOnline();sysChat(`${pname(u)} انقطع`);broadcast();render();}});});
 chatMsgs=LS.get('chat_'+c,[]);LS.set('room',c);LS.set('role','host');setOnline();view=G.status==='lobby'?'lobby':'table';prevLogLen=-1;onGame(null,viewFor(G,uid),true);return true;}
function onHostMsg(conn,msg){if(!msg||typeof msg!=='object')return;
 if(msg.t==='hello'){const u=String(msg.u||'').slice(0,20),name=String(msg.name||'لاعب').slice(0,18);if(!u)return;const known=G.players.some(p=>p.id===u);
  if(!known){if(G.status!=='lobby'){conn.send({t:'err',m:'المباراة في هذه الغرفة بدأت بالفعل'});setTimeout(()=>conn.close(),500);return;}const e=hostApply(u,{type:'join',name});if(e){conn.send({t:'err',m:e});setTimeout(()=>conn.close(),500);return;}}
  if(conns[u]&&conns[u]!==conn)try{conns[u].close();}catch(e){}conn.u=u;conns[u]=conn;setOnline();sysChat(`${pname(u)} ${known?'رجع للغرفة':'انضم'}`);conn.send({t:'welcome'});broadcast();conn.send({t:'chat',m:chatMsgs});render();return;}
 const u=conn.u;if(!u)return;
 if(msg.t==='op'){if(msg.op&&msg.op.type==='leave'&&G.status==='lobby'){hostApply(u,{type:'leave'});conn.close();return;}const e=hostApply(u,msg.op||{});conn.send({t:'ack',id:msg.id,err:e});return;}
 if(msg.t==='chat'){const x=String(msg.x||'').trim().slice(0,300);if(!x)return;chatMsgs.push({u,n:pname(u),x,t:Date.now()});chatMsgs=chatMsgs.slice(-80);relayChat();}}
let pend={},opSeq=0;
async function connectGuest(c,name,silent){if(!ready())return false;code=c;isHost=false;hostOK=false;
 try{if(!peer||peer.destroyed)peer=await openPeer();}catch(e){toast('تعذّر الاتصال بخادم الربط. تأكد من الإنترنت.','err');return false;}
 return new Promise(res=>{const conn=peer.connect(PFX+c,{reliable:true});let done=false;const fail=m=>{if(done)return;done=true;if(!silent)toast(m,'err');res(false);};
  const to=setTimeout(()=>{try{conn.close();}catch(e){}fail('ما لقيت الغرفة. تأكد من الرمز وأن المضيف فاتح الصفحة.');},12000);
  peer.once&&peer.on('error',e=>{if(e&&e.type==='peer-unavailable'){clearTimeout(to);fail('ما لقيت الغرفة. تأكد من الرمز وأن المضيف فاتح الصفحة.');}});
  conn.on('open',()=>conn.send({t:'hello',u:uid,name}));
  conn.on('data',msg=>{if(!msg)return;
   if(msg.t==='err'){clearTimeout(to);fail(msg.m);return;}
   if(msg.t==='welcome'){clearTimeout(to);done=true;hostConn=conn;hostOK=true;LS.set('room',c);LS.set('role','guest');LS.set('name',name);prevLogLen=-1;view='lobby';res(true);return;}
   if(msg.t==='state'){const old=G;online=new Set(msg.online||[]);onGame(old,msg.s);return;}
   if(msg.t==='chat'){chatMsgs=msg.m||[];renderSide();return;}
   if(msg.t==='ack'){const p=pend[msg.id];if(p){delete pend[msg.id];p(msg.err);}}});
  conn.on('close',()=>{if(hostConn!==conn)return;hostOK=false;hostConn=null;if(code){toast('انقطع الاتصال بالمضيف، أحاول أعيد الاتصال…','err');render();scheduleRetry();}});});}
function scheduleRetry(){clearTimeout(retryT);retryT=setTimeout(async()=>{if(!code||isHost||hostOK)return;const ok=await connectGuest(code,myName(),true);if(ok){toast('رجع الاتصال','good');render();}else scheduleRetry();},4000);}
async function commit(op){if(!code||!G)return false;
 if(isHost){const e=hostApply(uid,op);if(e){toast(e,'err');return false;}render();return true;}
 if(!hostOK){toast('غير متصل بالمضيف حالياً','err');return false;}if(busy){toast('انتظر لحظة…');return false;}busy=true;
 const id=++opSeq;const err=await new Promise(r=>{pend[id]=r;hostConn.send({t:'op',id,op});setTimeout(()=>{if(pend[id]){delete pend[id];r('ما وصل رد من المضيف، حاول مرة أخرى');}},10000);});busy=false;
 if(err){toast(err,'err');return false;}return true;}
async function createRoom(name,winSets,maxP){if(!ready())return;name=name.trim();if(!name)return toast('اكتب اسمك المستعار','err');LS.set('name',name);
 const counts={};for(const id in CARDS)if(CARDS[id].cnt!==ORIG[id].cnt)counts[id]=CARDS[id].cnt;
 for(let k=0;k<3;k++){const c=genCode();const S=E.newGame(c,uid,name,{rules:Object.assign({},CFG.rules||{},{winSets:+winSets||6}),counts});S.maxP=+maxP||6;S.log.push({t:Date.now(),m:`أنشأ ${name} الغرفة`});if(await startHost(c,S)){LS.set('host_'+c,S);return;}}}
async function joinRoom(c,name){c=c.trim().toUpperCase();name=name.trim();if(!c||!name)return toast('اكتب رمز الغرفة واسمك','err');LS.set('name',name);toast('جارٍ الاتصال بالغرفة…');const ok=await connectGuest(c,name);if(ok)render();else code=null;}
async function enterRoom(c){const role=LS.get('role','');if(role==='host'){const S=LS.get('host_'+c,null);if(S){for(let k=0;k<6;k++){if(await startHostQuiet(c,S))return;await sleep(3000);}toast('تعذّر إعادة فتح الغرفة','err');return;}}joinRoom(c,myName());}
async function startHostQuiet(c,S){try{peer=await openPeer(PFX+c);}catch(e){return false;}isHost=true;code=c;G=S;conns={};peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});peer.on('connection',conn=>{conn.on('data',msg=>onHostMsg(conn,msg));conn.on('close',()=>{const u=conn.u;if(u&&conns[u]===conn){delete conns[u];setOnline();sysChat(`${pname(u)} انقطع`);broadcast();render();}});});chatMsgs=LS.get('chat_'+c,[]);setOnline();view=G.status==='lobby'?'lobby':'table';prevLogLen=-1;onGame(null,viewFor(G,uid),true);toast('رجعت الغرفة '+c,'good');return true;}
function leaveView(){clearTimeout(retryT);if(hostConn)try{hostConn.close();}catch(e){}hostConn=null;hostOK=false;if(isHost){for(const u in conns)try{conns[u].close();}catch(e){}conns={};if(peer)try{peer.destroy();}catch(e){}peer=null;LS.set('host_'+code,null);}isHost=false;code=null;G=null;LS.set('room',null);view='home';render();}
function onGame(old,S,local){if(S.status==='lobby'&&view!=='lobby')view='lobby';if(S.status!=='lobby'&&(view==='lobby'))view='table';
 if(prevLogLen>=0&&S.log&&old&&S.log.length&&old.log){const lastOld=old.log.length?old.log[old.log.length-1].t:0;const fresh=S.log.filter(l=>l.t>lastOld);for(const l of fresh.slice(-3)){toast(l.m,l.k);if(l.k==='play')sfx.card();if(l.k==='bad')sfx.bad();if(l.k==='good')sfx.good();}}
 prevLogLen=S.log?S.log.length:0;
 if(S.pending&&S.pending.played&&(!old||!old.pending||old.pending.id!==S.pending.id))flashCard(S.pending.played[0]);
 if(S.status==='playing'){const k=S.tc+':'+S.turn.p;if(k!==lastTurnKey){lastTurnKey=k;if(S.turn.ctrl===uid){sfx.turn();toast('🎲 دورك الآن!','good');}}}
 if(S.pending&&S.status==='playing'){const pd=S.pending,a=E.stageActor(S);const key=pd.id+pd.stage+(pd.queue[0]||'')+(pd.lot||0);const need=pd.stage==='bid'?(uid!==pd.from&&pd.bids[uid]==null):a===uid;if(need&&key!==lastPendKey){lastPendKey=key;setTimeout(()=>{if(!$('#sheet'))pendingAction();},700);}}
 if(isHost)G=G;else G=S;render();}
function sendChat(text){text=text.trim().slice(0,300);if(!text||!code)return;if(isHost){chatMsgs.push({u:uid,n:myName(),x:text,t:Date.now()});chatMsgs=chatMsgs.slice(-80);relayChat();}else if(hostOK)hostConn.send({t:'chat',x:text});else toast('غير متصل بالمضيف','err');}
function myName(){if(G){const p=G.players.find(p=>p.id===uid);if(p)return p.name;}return LS.get('name','لاعب');}
async function init(){applyCfg();render();const c=LS.get('room',null);if(c)enterRoom(c);}
// host runs every timeout itself, so a player who left cannot freeze the table
setInterval(()=>{if(isHost&&G&&G.status==='playing'&&G.pending&&Date.now()-G.pending.dl>1500){const e=hostApply(uid,{type:'timeout'});}},1000);

// ---------- timers
setInterval(()=>{if(!G||G.status!=='playing'||!G.pending)return;const left=Math.max(0,G.pending.dl-Date.now());const bar=$('#pbar');if(bar)bar.style.width=(100*left/((G.cfg.timeout||60)*1000))+'%';const lt=$('#pleft');if(lt)lt.textContent=Math.ceil(left/1000)+'ث';
 
 const tb=$('#tobtn');if(tb)tb.hidden=left>0;},1000);

// ---------- helpers
function pname(u){const p=G&&G.players.find(x=>x.id===u);return p?p.name:'؟';}
function av(u,size){const i=G?G.players.findIndex(p=>p.id===u):0;return `<span class="av" style="background:${AVC[(i+AVC.length)%AVC.length]};${size?`width:${size}px;height:${size}px`:''}">${esc(pname(u).slice(0,1))}</span>`;}
function me(){return G&&G.P?G.P[uid]:null;}
function viewHandOwner(){if(!G||!G.turn)return uid;if(G.turn.ctrl===uid&&G.turn.p!==uid)return G.turn.p;return uid;}
function colorDot(c){return `<span class="sw" style="background:${COLORS[c].hex}"></span>`;}
function cardImg(iid,cls){return `<img src="${img(iid)}" alt="${esc(E.C(iid).n)}" class="${cls||''}" loading="lazy">`;}

// ---------- ask (sheet picker)
let sheetResolve=null;
function closeSheet(v){const s=$('#sheet');if(s)s.remove();const r=sheetResolve;sheetResolve=null;if(r)r(v);}
function sheet(html,onMount){closeSheet(null);const d=document.createElement('div');d.className='sheet-bg';d.id='sheet';d.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)closeSheet(null);});document.body.appendChild(d);if(onMount)onMount(d);return new Promise(r=>sheetResolve=r);}
function ask(title,options,opts){opts=opts||{};const h=`<h3>${esc(title)}</h3>${opts.sub?`<div class="muted">${opts.sub}</div>`:''}<div class="opts">${options.map((o,k)=>`<button class="opt" data-k="${k}" ${o.disabled?'disabled':''}>${o.img?`<img src="${o.img}" alt="">`:''}${o.color?`<span class="sw" style="width:18px;height:24px;background:${o.color}"></span>`:''}<span style="min-width:0"><div>${esc(o.label)}</div>${o.sub?`<div class="sub">${esc(o.sub)}</div>`:''}</span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" data-x="1">${opts.cancelText||'إلغاء'}</button></div>`;
 return sheet(h,d=>{d.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>closeSheet(options[+b.dataset.k].v));d.querySelector('[data-x]').onclick=()=>closeSheet(null);});}
async function pickPlayer(title,filter){const opts=G.order.filter(u=>u!==uid&&(!filter||filter(u))).map(u=>({v:u,label:pname(u),sub:`${E.score(G.P[u])} مجموعات • ${G.P[u].hand.length} بطاقة • بنك ${E.bankMoney(G.P[u])}M`}));if(!opts.length){toast('لا يوجد لاعب مناسب','err');return null;}return ask(title,opts);}
function landOpts(S,lands,ownerU){return lands.map(i=>{const l=S.P[ownerU].lands.find(x=>x.i===i);return{v:i,label:E.C(i).n,sub:`${COLORS[l.c].n} • ${E.C(i).v||0}M`,img:img(i)};});}
function setOpts(cols,u){return cols.map(c=>({v:c,label:'مجموعة '+COLORS[c].n,color:COLORS[c].hex,sub:`إيجارها ${E.rentOf(G.P[u],c)}M${E.fenced(G.P[u],c)?' • عليها شبوك':''}`}));}

function myTurn(){return G&&G.status==='playing'&&G.turn.ctrl===uid&&G.turn.phase==='play'&&!G.pending;}
async function cardModal(iid,ctx){const c=E.C(iid);const S=G;const actor=viewHandOwner();const p=S.P[actor];const left=myTurn()?E.movesLeft(S):0;
 const btns=[];
 if(ctx==='hand'){

  if(myTurn()&&left>0){
   if(c.t==='money'||c.t==='visa')btns.push(['bank','ضعها في البنك','gold']);

   if(c.a!=='burn'&&p.hand.some(x=>E.C(x).a==='burn'))btns.push(['burnthis','احرق هذه البطاقة','']);
  }}
 const txt=c.t==='mission'?c.d:(c.d||(c.t==='land'?`أرض ${COLORS[c.c].n} • القيمة ${c.v}M • الإيجار: ${COLORS[c.c].rent.map((r,k)=>(k+1)+'←'+r+'M').join('، ')}`:c.t==='dual'?`أرض بوجهين: ${c.cs.map(x=>COLORS[x].n).join(' / ')} • القيمة ${c.v}M. قلبها يُحسب حركة.`:c.t==='money'?`نقود قيمتها ${c.v} مليون، توضع في البنك.`:''));
 const h=`<div class="cardview"><img src="${img(iid)}" alt=""><div class="stack" style="gap:8px;min-width:0"><h3>${esc(c.n)}</h3><div class="muted" style="font-size:12px">${esc(c.g||'')}${c.black?' • بطاقة سوداء':''}</div><div style="line-height:1.8">${esc(txt)}</div></div></div><div class="stack" style="margin-top:16px;gap:8px">${btns.map(([k,l,cl])=>`<button class="btn ${cl}" data-b="${k}" ${k==='x'?'disabled':''}>${esc(l)}</button>`).join('')}<button class="btn" data-b="cancel">إلغاء</button></div>`;
 const r=await sheet(h,d=>d.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.b)));
 if(!r||r==='cancel'||r==='x')return;
 if(r==='respond')return respondWith(iid);
 if(r==='bank')return commit({type:'bank',card:iid});
 if(r==='land'){let color=c.c;if(c.t==='dual'){color=await ask('اختر الوجه',c.cs.map(x=>({v:x,label:COLORS[x].n,color:COLORS[x].hex})));if(!color)return;}if(c.t==='joker'){color=await ask('الجوكر يمثّل أي لون',Object.keys(COLORS).map(x=>({v:x,label:COLORS[x].n,color:COLORS[x].hex,sub:`لديك ${(E.setInfo(p)[x]||{n:0}).n} من ${COLORS[x].size}`})));if(!color)return;}return commit({type:'land',card:iid,color});}
 if(r==='build'){const cols=E.completeColors(p).filter(x=>c.b==='fence'||!E.NO_BUILD.includes(x));if(!cols.length)return toast('تحتاج مجموعة كاملة (المباني لا تُضاف للمطاعم والمحطات)','err');const color=await ask('أضف '+c.n+' إلى',setOpts(cols,actor));if(color)commit({type:'build',card:iid,color});return;}
 if(r==='burn'){const o=p.hand.filter(x=>x!==iid);const other=await ask('اختر البطاقة التي تريد حرقها',o.map(x=>({v:x,label:E.C(x).n,img:img(x)})));if(other)commit({type:'burn',card:iid,other});return;}
 if(r==='burnthis'){const b=p.hand.find(x=>E.C(x).a==='burn');return commit({type:'burn',card:b,other:iid});}
 if(r==='play')return playWizard(iid);}
async function chooseMult(p,a){const left=E.movesLeft(G);if(!E.MULTABLE.includes(a)||left<2)return undefined;const ms=p.hand.filter(x=>['double','triple'].includes(E.C(x).a));if(!ms.length)return undefined;const r=await ask('تضعيف المبلغ؟',[{v:'none',label:'بدون تضعيف'},...ms.map(x=>({v:x,label:E.C(x).n,img:img(x),sub:'تُحسب حركة إضافية'}))]);if(r===null)return null;return r==='none'?undefined:r;}
async function playWizard(iid,asAction){const S=G;const actor=S.turn.p;const p=S.P[actor];const c=E.C(iid);let a=c.t==='rent'?'rent':c.a;const op={type:'play',card:iid};
 if(a==='royal'){const acts=[{v:'rent',label:'إيجار (أي لون)'}];const seen=new Set();for(const id in CARDS){const x=CARDS[id];if(x.t==='action'&&!x.black&&!E.RESP.includes(x.a)&&!['double','triple','burn','royal'].includes(x.a)&&!seen.has(x.a)){seen.add(x.a);acts.push({v:x.a,label:x.n,img:'img/'+id+'.jpg'});}}a=await ask('المرسوم الملكي: اختر الأمر',acts,{sub:'تصبح البطاقة هذا الأمر، ولا تُرد إلا بـ تخسسسي.'});if(!a)return;op.as=a;}
 const opp=S.order.filter(u=>u!==actor);
 if(a==='rent'){const cs=(c.t==='rent'?c.cs:Object.keys(COLORS)).filter(x=>E.setInfo(p)[x]);if(!cs.length)return toast('لا تملك أرضاً من ألوان هذه البطاقة','err');const col=await ask('اختر لون الإيجار',cs.map(x=>({v:x,label:COLORS[x].n,color:COLORS[x].hex,sub:`الإيجار ${E.rentOf(p,x)}M من كل لاعب`})));if(!col)return;op.color=col;const m=await chooseMult(p,'rent');if(m===null)return;if(m)op.mult=m;return commit(op);}
 if(a==='rentgold'){const all=[];for(const u of S.order)for(const l of S.P[u].lands)all.push({v:l.i,label:E.C(l.i).n,sub:`${COLORS[l.c].n} عند ${pname(u)} • الإيجار ${E.rentOf(S.P[u],l.c)}M`,img:img(l.i)});if(!all.length)return toast('لا توجد أراضٍ في الساحة','err');const land=await ask('اختر أي أرض في الساحة',all);if(!land)return;op.land=land;const m=await chooseMult(p,'rentgold');if(m===null)return;if(m)op.mult=m;return commit(op);}
 if(E.SELF.includes(a)){const ok=await ask(E.opLabel(a),[{v:1,label:'نفّذ الآن'}],{sub:esc(E.C(iid).d||'')});if(ok)commit(op);return;}
 if(['theeb','boom','nuke'].includes(a)){op.sel={};for(const u of opp){const o=E.selOptions(S,a,actor,u);if(!o.length)continue;const v=await ask(`${E.opLabel(a)}: اختر من ${pname(u)}`,a==='nuke'?setOpts(o,u):landOpts(S,o,u));if(v===null)return;op.sel[u]=v;}return commit(op);}
 if(['dabatni','cash'].includes(a)){const ok=await ask(E.opLabel(a),[{v:1,label:'وجّه الأمر لجميع اللاعبين'}]);if(ok)commit(op);return;}
 if(a==='auction'){op.sel={};for(let k=0;k<3;k++){const cand=opp.filter(u=>!op.sel[u]&&E.looseLands(S.P[u]).length);if(!cand.length)break;const opts=cand.map(u=>({v:u,label:pname(u),sub:E.looseLands(S.P[u]).length+' أرض خارج المجموعات'}));if(k>0)opts.unshift({v:'done',label:'ابدأ المزاد الآن'});const u=await ask(`المزاد: اختر لاعباً (${k+1} من 3)`,opts);if(u===null)return;if(u==='done')break;const l=await ask('اختر الأرض',landOpts(S,E.looseLands(S.P[u]),u));if(!l)return;op.sel[u]=l;}if(!Object.keys(op.sel).length)return toast('لا توجد أراضٍ خارج المجموعات','err');return commit(op);}
 // single target
 if(a==='swapset'){const mine=E.completeColors(p).filter(x=>!E.fenced(p,x));if(!mine.length)return toast('تحتاج مجموعة كاملة بدون شبوك','err');op.mine=await ask('اختر مجموعتك',setOpts(mine,actor));if(!op.mine)return;}
 if(a==='atni'){const mine=E.looseLands(p);if(!mine.length)return toast('تحتاج أرضاً خارج المجموعات','err');op.mine=await ask('اختر أرضك التي ستعطيها',landOpts(S,mine,actor));if(!op.mine)return;}
 if(a==='give'){op.give=await ask('اختر البطاقة التي ستعطيها',p.hand.filter(x=>x!==iid).map(x=>({v:x,label:E.C(x).n,img:img(x)})));if(!op.give)return;}
 const t=await pickPlayer(E.opLabel(a)+': اختر اللاعب',u=>{if(E.needSel(a))return E.selOptions(S,a,actor,u).length>0;if(a==='swaphand'||a==='takecard')return S.P[u].hand.length>0;return true;});if(!t)return;op.t=t;
 if(E.needSel(a)){const o=E.selOptions(S,a,actor,t);const v=await ask('اختر',['set','setany'].includes(E.needSel(a))?setOpts(o,t):landOpts(S,o,t));if(!v)return;op.sel=v;}
 if(a==='rentwild'){const cs=Object.keys(E.setInfo(p));if(!cs.length)return toast('لا تملك أراضي','err');op.color=await ask('اختر لون الإيجار',cs.map(x=>({v:x,label:COLORS[x].n,color:COLORS[x].hex,sub:`${E.rentOf(p,x)}M`})));if(!op.color)return;}
 const m=await chooseMult(p,a);if(m===null)return;if(m)op.mult=m;
 commit(op);}
async function respondWith(iid){const a=E.C(iid).a;const pd=G.pending;const op={type:'respond',card:iid};
 if(a==='asfeq'){op.to=await pickPlayer('حوّل الأمر إلى',u=>u!==pd.from&&u!==uid);if(!op.to)return;}
 if(a==='payforme'){op.to=await pickPlayer('من يدفع عنك؟',u=>u!==pd.benef&&u!==uid);if(!op.to)return;}
 commit(op);}
async function paySheet(){const pd=G.pending,pay=pd.pay,p=G.P[uid];const pool=E.payable(p);let sel=new Set(E.autoPick(G,uid,pay.amount));const hasChange=p.hand.some(x=>E.C(x).a==='change');let change=false;
 const draw=d=>{const sum=[...sel].reduce((s,i)=>s+(E.C(i).v||0),0);d.querySelector('#paysum').textContent=sum+'M';d.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('sel',sel.has(b.dataset.i)));};
 const items=pool.map(i=>{const inBank=p.bank.includes(i);return `<button class="opt" data-i="${i}"><img src="${img(i)}" alt=""><span><div>${esc(E.C(i).n)}</div><div class="sub">${inBank?'من البنك':'أرض'} • ${E.C(i).v||0}M</div></span></button>`;}).join('');
 const h=`<h3>ادفع ${pay.amount}M لـ ${esc(pname(pay.payee))}</h3><div class="muted">اختر من بنكك وأراضيك خارج المجموعات. لا يُعاد الباقي إلا بـ «وين الباقي؟». المختار: <b id="paysum"></b></div>${E.hasVisa(p)?`<button class="btn gold" data-v="visa" style="margin-top:10px;width:100%">💳 سدّد بالفيزا</button>`:''}<div class="opts">${items||'<div class="muted">لا تملك ما تدفعه</div>'}</div>${hasChange?`<label class="row" style="margin-top:10px"><input type="checkbox" id="chg"> استخدم «وين الباقي؟» لاسترجاع الفرق</label>`:''}<div class="row" style="margin-top:14px"><button class="btn gold" data-v="pay">ادفع</button></div>`;
 const r=await sheet(h,d=>{draw(d);d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);draw(d);});const ch=d.querySelector('#chg');if(ch)ch.onchange=()=>change=ch.checked;d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.v));});
 if(r==='visa')return commit({type:'pay',visa:true});if(r==='pay')return commit({type:'pay',cards:[...sel],change});}
async function pendingAction(){const pd=G.pending;if(!pd)return;const actor=E.stageActor(G);const p=G.P[uid];
 if(pd.stage==='bid'){if(uid===pd.from)return;const lot=pd.lots[pd.lot];const h=`<h3>مزاد على ${esc(E.C(lot.i).n)}</h3><div class="cardview" style="grid-template-columns:110px 1fr"><img src="${img(lot.i)}" alt=""><div class="stack"><div class="muted">رصيد بنكك ${E.bankMoney(p)}M${E.hasVisa(p)?' + فيزا':''}. صاحب أعلى مبلغ يحصل على الأرض، والمبلغ لـ ${esc(pname(pd.from))}.</div><div class="field"><label for="bidv">مبلغك (بالمليون)</label><input id="bidv" type="number" min="0" inputmode="numeric" value="0"></div></div></div><div class="row" style="margin-top:14px"><button class="btn gold" data-v="bid">قدّم المبلغ</button><button class="btn" data-v="pass">لا أشارك</button></div>`;
  const r=await sheet(h,d=>d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.v==='pass'?0:+(d.querySelector('#bidv').value||0))));if(r===null)return;return commit({type:'bid',amount:r});}
 if(actor!==uid)return;
 if(pd.stage==='pay')return paySheet();
 if(pd.stage==='choose'){const ls=E.looseLands(p);const v=await ask(`أعطِ ${pname(pd.benef)} أرضاً من اختيارك`,landOpts(G,ls,uid),{cancelText:'لاحقاً'});if(v)commit({type:'choose',land:v});return;}
 if(pd.stage==='retarget'){const v=await pickPlayer('شف غيري! اختر لاعباً آخر',u=>u!==pd.from&&!(pd.excl||[]).includes(u));if(v)commit({type:'retarget',t:v});return;}
 if(pd.stage==='reselect'){const t=pd.queue[0];const k=E.needSel(pd.a);const op={type:'reselect'};if(pd.a==='swapset'){op.mine=await ask('اختر مجموعتك',setOpts(E.completeColors(p).filter(x=>!E.fenced(p,x)),uid));if(!op.mine)return;}if(pd.a==='atni'){op.mine=await ask('اختر أرضك',landOpts(G,E.looseLands(p),uid));if(!op.mine)return;}const o=E.selOptions(G,pd.a,uid,t);const v=await ask(`تحوّل الأمر إلى ${pname(t)}: اختر`,['set','setany'].includes(k)?setOpts(o,t):landOpts(G,o,t),{cancelText:'تنازل عن الأمر'});if(!v)return commit({type:'giveup'});op.sel=v;return commit(op);}
 const resp=p.hand.filter(x=>E.C(x).a&&E.respOK(G,pd,uid,E.C(x).a));
 if(pd.stage==='counter'){const r=await ask(`${pname(pd.refuser)} رفض أمرك`,[{v:'pass',label:'اقبل الرفض'},...resp.map(x=>({v:x,label:'ردّ بـ '+E.C(x).n,img:img(x),sub:'يلغي الرفض ويعيد الأمر'}))],{cancelText:'لاحقاً'});if(r==='pass')return commit({type:'pass'});if(r)return respondWith(r);return;}
 if(pd.stage==='respond'){const amt=E.PAY_ACTIONS.includes(pd.a)?E.payAmount(G,pd,uid):0;const r=await ask(`${pname(pd.from)} وجّه إليك: ${pd.label}`,[{v:'accept',label:amt?`اقبل وادفع ${amt}M`:'اقبل الأمر'},...resp.map(x=>({v:x,label:'ردّ بـ '+E.C(x).n,img:img(x),sub:E.C(x).d}))],{sub:esc(descOf(pd)),cancelText:'لاحقاً'});if(r==='accept')return commit({type:'accept'});if(r)return respondWith(r);}}
function descOf(pd){const c=pd.played?E.C(pd.played[0]):null;const t=pd.queue[0];let s=c?(c.d||''):'';const sel=pd.sel&&pd.sel[t];if(sel){s+=' • المستهدف: '+(COLORS[sel]?'مجموعة '+COLORS[sel].n:E.C(sel).n);}if(pd.black)s+=' • أمر أسود: لا يُرد إلا بـ تخسسسي';return s;}

<h3>البداية</h3><ul><li>توزَّع 5 أوراق لكل لاعب ومهمة واحدة سرية، ويحتفظ كل لاعب بأوراقه سراً.</li><li>بقية الأوراق في المنتصف للسحب.</li></ul>
<h3>الدور</h3><ul><li>قبل اللعب يسحب اللاعب ورقتين (أو خمساً إذا انتهت الأوراق من يده)، ثم يلعب ${(CFG.rules&&CFG.rules.moves)||3} حركات.</li><li>إنزال أرض أو مبلغ في البنك أو أمر في الساحة = حركة. قلب الأرض ذات الوجهين ونقل الجوكر وتحريك البيت والقصر والفندق والشبوك = حركة.</li><li>إذا تجاوزت يدك 7 أوراق بعد السحب، تُحرق الزيادة عشوائياً.</li></ul>
<h3>المجموعات</h3><ul><li>المجموعة أراضٍ من نفس اللون: منها ما يكتمل بـ 4 (المحطات)، أو 3، أو 2.</li><li>عند اكتمال المجموعة يمكن إضافة بيت وفندق وقصر وشبوك. لا يضاف البيت والفندق والقصر إلى المطاعم والمحطات.</li><li>لا يمكن فك المجموعة حتى لو طُلب منك مبلغ.</li><li>إذا سُرقت أرض من مجموعة عليها مبانٍ، تنتقل المباني إلى مجموعة أخرى لديك، وإلا ترجع إلى يدك.</li></ul>
<h3>البنك</h3><ul><li>لا يوضع في البنك إلا المال والفيزا. لا تنزل بطاقات الأوامر في البنك.</li><li>إذا لم يكفِ البنك تدفع من أراضيك خارج المجموعات. لا يعاد الباقي إلا ببطاقة «وين الباقي؟».</li><li>الفيزا تكفي لتسديد أي مبلغ وتنتقل إلى بنك صاحب الطلب.</li></ul>
<h3>المهام</h3><ul><li>المهمة المحققة تُكشف وتُحسب مجموعة كاملة لا يمكن سرقتها أو تدميرها. لا تُسحب مهمة أخرى إلا ببطاقة «صندوق».</li></ul>
<h3>الفوز</h3><ul><li>في اللعب الفردي بـ 4 لاعبين: أول من يجمع 6 مجموعات يفوز.</li></ul>
<h3>الردود</h3><ul><li>البطاقات السوداء لا تُرد إلا بـ «تخسسسي».</li><li>«عكس» فقط على الأوامر الموجهة لك وحدك، ولا يُلعب على المزاد. «روح يمين/يسار» لا يُلعب على المزاد، وإذا كان اللاعب المجاور هو صاحب الأمر يتخطاه.</li><li>«Loading» يؤجل الأمر إلى دورك القادم بعد أن تسحب، ولك الحرية في الرد.</li><li>«تعطيل» مثل «العب بعيد» لكن يمكن الدفاع بها عن أي لاعب.</li><li>«جبها أنت»: صاحب الطلب يدفع لك أنت.</li></ul>
<h3>السجن</h3><ul><li>يُمنع المسجون من اللعب 3 دورات، ويخرج بدفع 2 مليون. إذا لم يملك أرضاً ولا بنكاً: يسحب ورقتين، الأرض والمال لصاحب الأمر والأوامر تُحرق، ثم يلعب ويخرج.</li></ul>
<h3>المزاد</h3><ul><li>صاحب الأمر يأخذ أرضاً (خارج المجموعات) من ثلاثة لاعبين، ولكل أرض مزادها، والمبالغ له، ولا يشارك فيه. إن لم يشترِ أحد تُحرق الأرض. يُرد على المزاد فقط إذا أُخذت أرض منك.</li></ul>
</div></div>`;}
let atab='cards',adminRooms=null,admDraft=null;
function adminV(){if(!owner)return `<div class="wrap empty-st">لوحة التحكم غير متاحة. <button class="btn sm" data-go="back">رجوع</button></div>`;admDraft=admDraft||JSON.parse(JSON.stringify(CFG));admDraft.cards=admDraft.cards||{};admDraft.rules=Object.assign({},E.DEFAULT_RULES,admDraft.rules||{});
 const tabs=`<div class="chips">${[['cards','البطاقات'],['rules','القواعد'],['review','قائمة المراجعة']].map(([k,l])=>`<button class="chip ${atab===k?'on':''}" data-atab="${k}">${l}</button>`).join('')}</div>`;
 let body='';
 if(atab==='cards'){body=`<div class="tblwrap"><table class="adm"><thead><tr><th></th><th>الاسم</th><th>النسخ</th><th>القيمة</th><th>الوصف</th></tr></thead><tbody>${Object.values(CARDS).map(c=>{const o=admDraft.cards[c.id]||{};return `<tr><td><img src="img/${c.id}.jpg" alt="" style="width:40px;border-radius:4px"></td><td><input data-ac="${c.id}" data-f="n" value="${esc(o.n||'')}" placeholder="${esc(ORIG[c.id].n)}"></td><td style="width:64px"><input data-ac="${c.id}" data-f="cnt" type="number" min="0" value="${o.cnt!=null?o.cnt:''}" placeholder="${ORIG[c.id].cnt}"></td><td style="width:64px"><input data-ac="${c.id}" data-f="v" type="number" min="0" value="${o.v!=null?o.v:''}" placeholder="${ORIG[c.id].v||0}"></td><td style="min-width:220px"><input data-ac="${c.id}" data-f="d" value="${esc(o.d||'')}" placeholder="${esc(ORIG[c.id].d||'')}"></td></tr>`;}).join('')}</tbody></table></div><div class="muted" style="font-size:12.5px">الحقول الفارغة تستخدم القيمة الأصلية. أعداد النسخ تُطبَّق على الغرف الجديدة فقط. تأثيرات البطاقات مبرمجة في المحرك، والوصف هنا للعرض.</div><button class="btn gold" data-go="admsave">حفظ</button>`;}
 if(atab==='rules'){const r=admDraft.rules;const f=[['moves','عدد الحركات في الدور'],['draw','السحب في بداية الدور'],['drawEmpty','السحب عند انتهاء الأوراق'],['handLimit','الحد الأقصى لأوراق اليد'],['winSets','مجموعات الفوز (افتراضي)'],['jailTurns','دورات السجن'],['jailFee','رسوم الخروج من السجن (مليون)'],['timeout','مهلة الرد (ثانية)']];body=`<div class="stack" style="max-width:420px">${f.map(([k,l])=>`<div class="field"><label for="ar_${k}">${l}</label><input id="ar_${k}" data-ar="${k}" type="number" min="0" value="${r[k]}"></div>`).join('')}<button class="btn gold" data-go="admsave">حفظ القواعد</button><div class="muted" style="font-size:12.5px">تُطبَّق على الغرف التي تُنشأ بعد الحفظ.</div></div>`;}
 if(atab==='rooms'){if(!adminRooms){loadRooms();body='<div class="muted">جارٍ التحميل…</div>';}else body=`<button class="btn sm" data-go="admreload">تحديث</button><div class="stack">${adminRooms.map(r=>`<div class="pl" style="flex-wrap:wrap"><b style="direction:ltr">${esc(r.code)}</b><span class="muted">${{lobby:'انتظار',playing:'جارية',ended:'منتهية'}[r.status]} • ${r.players.length} لاعبين • ${new Date(r.created).toLocaleString('ar-SA')}</span><span style="flex:1"></span><button class="btn sm" data-rlog="${esc(r.code)}">السجل</button><button class="btn sm" data-rlobby="${esc(r.code)}">إعادة للانتظار</button><button class="btn sm" data-rstop="${esc(r.code)}">إيقاف</button><button class="btn sm red" data-rdel="${esc(r.code)}">حذف</button></div>`).join('')||'<div class="muted">لا توجد غرف</div>'}</div>`;}
 if(atab==='review'){body=`<div class="rules"><ul>
 <li><b>«حركة تكتيكية!»</b>: نص الوظيفة مقلوب وغير واضح. طُبّقت مؤقتاً بمعنى «لاعب يلعب حركة واحدة فقط في دوره القادم». أكّد الوظيفة.</li>
 <li><b>مجموع البطاقات</b>: المسجّل ${Object.values(CARDS).reduce((s,c)=>s+c.cnt,0)} بطاقة مقابل 265. عُدّت النسخ من الصور (مثلاً: «إيجار» الملوّن 4، «عطني وأعطيك» 3، المهام 20). المحطات مؤكدة: 7 بطاقات والمجموعة تكتمل بـ 4. أعطني الأعداد الصحيحة إن اختلفت.</li>
 <li><b>المضاعفة (Double/Triple)</b>: احتُسبت حركة مستقلة مع بطاقة الإيجار أو الضريبة، كما نصت القواعد على أن «إحرق» وحدها تُحسب مع بطاقتها حركة واحدة.</li>
 <li><b>الشبوك</b>: يحمي المجموعة من كل أنواع السرقة والحرق ما عدا NUKE (كما نصت البطاقة)، ويشمل ذلك Get The Joker و«خرب عليه».</li>
 <li><b>أثر البيت/الفندق/القصر</b>: احتُسبت إضافة للإيجار (+2/+5/+3 مليون).</li>
 <li><b>Golden Rent</b>: الإيجار يُحسب بعدد أراضي ذلك اللون عند صاحب الأرض المختارة.</li>
 <li><b>«يمين» و«يسار»</b>: اليمين هو اللاعب التالي في ترتيب الدور، واليسار السابق.</li>
 <li><b>«مرسوم ملكي» و«هذا اللي معي»</b>: «هذا اللي معي» تسدّ المبلغ كاملاً وتُحرق. المرسوم يصبح أي أمر غير أسود ويُعامل كبطاقة سوداء.</li>
 <li><b>اللعب الجماعي والفوز بعدد لاعبين غير 4</b>: غير مذكور في القواعد المرسلة. مجموعات الفوز قابلة للتعديل من المضيف.</li>
 <li><b>BOOOM ولعبتك يا الذيب وNUKE</b>: صاحب الأمر يختار الأرض أو المجموعة من كل لاعب.</li>
 </ul></div>`;}
 return `<div class="wrap stack"><div class="row" style="justify-content:space-between"><h2 style="font-size:32px">لوحة التحكم</h2><button class="btn sm" data-go="back">رجوع</button></div>${tabs}${body}</div>`;}
async function loadRooms(){try{const s=await db.collection('games').orderBy('created','desc').limit(40).get();adminRooms=s.docs.map(d=>d.data());}catch(e){adminRooms=[];}render();}

// ---------- binding
function bind(){const app=$('#app');
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go);});
 app.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>cardModal(b.dataset.card,b.dataset.ctx||'view'));
 app.querySelectorAll('[data-pod]').forEach(b=>b.onclick=()=>podSheet(b.dataset.pod));
 app.querySelectorAll('[data-land]').forEach(b=>b.onclick=()=>landTap(b.dataset.land,b.dataset.lo));
 app.querySelectorAll('[data-bld]').forEach(b=>b.onclick=()=>bldTap(b.dataset.bld,b.dataset.lo));
 app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=async()=>{const w=b.dataset.kick;if(await commit({type:'kick',who:w})&&conns[w]){conns[w].send({t:'err',m:'أخرجك المضيف من الغرفة'});setTimeout(()=>{try{conns[w].close();}catch(e){}},300);}});
 app.querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{gfilter=b.dataset.gf;render();});
 const q=$('#gq');if(q)q.oninput=()=>{gq=q.value;const pos=q.selectionStart;render();const n=$('#gq');n.focus();n.setSelectionRange(pos,pos);};
 app.querySelectorAll('[data-atab]').forEach(b=>b.onclick=()=>{atab=b.dataset.atab;render();});
 app.querySelectorAll('[data-ac]').forEach(i=>i.onchange=()=>{const id=i.dataset.ac,f=i.dataset.f;admDraft.cards[id]=admDraft.cards[id]||{};if(i.value==='')delete admDraft.cards[id][f];else admDraft.cards[id][f]=f==='cnt'||f==='v'?+i.value:i.value;});
 app.querySelectorAll('[data-ar]').forEach(i=>i.onchange=()=>{admDraft.rules[i.dataset.ar]=+i.value;});
 app.querySelectorAll('[data-rstop]').forEach(b=>b.onclick=()=>admRoom(b.dataset.rstop,'stop'));app.querySelectorAll('[data-rlobby]').forEach(b=>b.onclick=()=>admRoom(b.dataset.rlobby,'lobby'));app.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>admRoom(b.dataset.rdel,'del'));app.querySelectorAll('[data-rlog]').forEach(b=>b.onclick=()=>admRoom(b.dataset.rlog,'log'));
 if(view==='table'&&G&&G.status==='playing'){prevHand=new Set((G.P[viewHandOwner()]||{hand:[]}).hand);}}
async function admRoom(c,what){const ref=db.doc('games/'+c);if(what==='log'){const s=await ref.get();const d=s.data();await sheet(`<h3>سجل ${esc(c)}</h3><div class="logl" style="max-height:60vh">${(d.log||[]).slice().reverse().map(l=>`<div>${new Date(l.t).toLocaleTimeString('ar-SA')} — ${esc(l.m)}</div>`).join('')}</div><button class="btn" data-x="1">إغلاق</button>`,d=>d.querySelector('[data-x]').onclick=()=>closeSheet());return;}
 if(what==='del'){const ok=await ask('حذف الغرفة '+c+'؟',[{v:1,label:'نعم، احذفها نهائياً'}]);if(!ok)return;await ref.delete();}
 else{const s=await ref.get();if(!s.exists)return;const d=s.data();if(what==='stop'){d.status='ended';d.winner=d.winner||null;d.pending=null;d.endedAt=Date.now();d.log=(d.log||[]).concat([{t:Date.now(),m:'أوقف صاحب الصفحة المباراة'}]);}if(what==='lobby'){d.status='lobby';d.pending=null;}await ref.set(d);}
 adminRooms=null;render();toast('تم');}
async function go(k){switch(k){
 case 'home':view='home';render();break;case 'create':view='create';render();break;case 'join':view='join';render();break;
 case 'quick':if(code&&G){view=G.status==='lobby'?'lobby':'table';render();}else{view='create';render();}break;
 case 'rejoin':{const c=LS.get('room',null);if(c)enterRoom(c);break;}
 case 'howto':backTo=view==='table'?'table':'home';view='howto';render();break;case 'gallery':backTo=view==='table'?'table':'home';view='gallery';render();break;case 'admin':view='admin';backTo='home';render();break;
 case 'back':view=backTo==='table'&&G?(G.status==='lobby'?'lobby':'table'):'home';render();break;
 case 'docreate':createRoom($('#nm').value,$('#ws').value,$('#mp').value);break;
 case 'dojoin':joinRoom($('#jc').value,$('#nm').value);break;
 case 'copy':try{await navigator.clipboard.writeText(G.code);toast('نُسخ الرمز');}catch(e){toast('الرمز: '+G.code);}break;
 case 'savews':commit({type:'settings',winSets:+$('#lws').value});break;
 case 'start':commit({type:'start'});break;
 case 'leave':if(!isHost&&G&&G.status==='lobby'&&hostOK)await commit({type:'leave'});leaveView();break;
 case 'restart':if(await commit({type:'restart'}))view='lobby';render();break;
 case 'draw':if(G.turn.ctrl===uid&&G.turn.phase==='draw')commit({type:'draw'});else toast('السحب في بداية دورك فقط');break;
 case 'end':commit({type:'end'});break;
 case 'pending':pendingAction();break;
 case 'defend':{const p=G.P[uid];const cs=p.hand.filter(x=>E.C(x).a&&E.respOK(G,G.pending,uid,E.C(x).a));const r=await ask('دافع عن '+pname(G.pending.queue[0]),cs.map(x=>({v:x,label:E.C(x).n,img:img(x)})));if(r)commit({type:'respond',card:r});break;}
 case 'timeout':commit({type:'timeout'});break;
 case 'jailpay':commit({type:'jailPay'});break;case 'jailwait':commit({type:'jailWait'});break;case 'jailbroke':commit({type:'jailBroke'});break;
 case 'log':sideSheet('log');break;case 'chat':sideSheet('chat');break;case 'menu':menuSheet();break;
 case 'admsave':CFG=admDraft;LS.set('cfg',CFG);applyCfg();toast('تم الحفظ على هذا الجهاز. يُطبَّق على الغرف اللي تنشئها أنت.','good');admDraft=null;render();break;
 case 'admreload':adminRooms=null;render();break;
}}
init();
